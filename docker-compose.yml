version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: family_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - family_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: family_server
    restart: always
    env_file:
      - env/backend.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/family_library
      - UPLOAD_DIR=/app/uploads
    volumes:
      - server_uploads:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - family_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        - VITE_API_BASE_URL=http://localhost:5000
        - VITE_APP_NAME=Family Library & Heritage
    container_name: family_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - family_network

volumes:
  mongo_data:
    name: mongo_data
  server_uploads:
    name: server_uploads

networks:
  family_network:
    name: family_network
